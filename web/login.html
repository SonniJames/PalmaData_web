<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PalmaData · Ingreso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/core/tokens.css">
<style>
.wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}

/* ---------- Panel izquierdo (marca) ---------- */
.brand-panel{
  position:relative;overflow:hidden;
  background:var(--forest);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:48px 56px;color:#fff;
}
/* patrón de frondas en SVG, muy sutil */
.fronds{position:absolute;inset:0;opacity:.10;pointer-events:none}
.brand-top{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.brand-mark{
  width:46px;height:46px;border-radius:12px;background:#fff;
  display:grid;place-items:center;overflow:hidden;flex:none;
}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.3px}
.brand-name span{color:var(--gold)}

.brand-hero{position:relative;z-index:1;max-width:460px}
.eyebrow{
  font-family:var(--font-display);font-size:12px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;color:var(--gold);
  display:inline-block;margin-bottom:20px;
}
.brand-hero h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(30px,3.4vw,46px);line-height:1.08;margin:0 0 18px;
}
.brand-hero p{color:#c5d6cb;font-size:16px;line-height:1.6;margin:0}

.brand-foot{position:relative;z-index:1;color:#8fae9c;font-size:13px}

/* ---------- Panel derecho (formulario) ---------- */
.form-panel{display:grid;place-items:center;padding:40px;background:var(--cream)}
.card{width:100%;max-width:380px}
.card h2{
  font-family:var(--font-display);font-weight:600;font-size:26px;
  margin:0 0 6px;color:var(--ink);
}
.card .sub{color:var(--ink-soft);font-size:15px;margin:0 0 32px}

.field{margin-bottom:18px}
.field label{
  display:block;font-size:13px;font-weight:600;color:var(--ink);
  margin-bottom:8px;
}
.field input{
  width:100%;padding:13px 15px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);font-size:15px;background:#fff;
  transition:border-color .15s, box-shadow .15s;
}
.field input:focus{
  border-color:var(--palm);
  box-shadow:0 0 0 3px rgba(47,125,79,.14);
  outline:none;
}
.btn-login{
  width:100%;padding:14px;border:none;border-radius:var(--radius-sm);
  background:var(--amber);color:#fff;font-weight:600;font-size:15px;
  transition:background .15s, transform .05s;margin-top:6px;
}
.btn-login:hover{background:var(--amber-hover)}
.btn-login:active{transform:translateY(1px)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}

.error{
  background:var(--danger-soft);color:var(--danger);
  padding:11px 14px;border-radius:var(--radius-sm);font-size:14px;
  margin-bottom:18px;display:none;
}
.error.show{display:block}

/* Responsive: en móvil, solo el formulario */
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .brand-panel{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Marca -->
  <section class="brand-panel">
    <svg class="fronds" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <g id="frond">
          <path d="M0,0 C30,-8 60,-6 90,10 C60,4 30,6 0,18 Z" fill="#fff"/>
          <path d="M0,0 C28,-18 58,-24 84,-20 C58,-10 30,-4 0,10 Z" fill="#fff"/>
          <path d="M0,0 C20,-30 44,-46 70,-52 C48,-30 24,-12 0,4 Z" fill="#fff"/>
        </g>
      </defs>
      <use href="#frond" transform="translate(70,80) rotate(20) scale(1.4)"/>
      <use href="#frond" transform="translate(250,60) rotate(80) scale(1.6)"/>
      <use href="#frond" transform="translate(330,220) rotate(150) scale(1.5)"/>
      <use href="#frond" transform="translate(120,300) rotate(220) scale(1.7)"/>
      <use href="#frond" transform="translate(30,240) rotate(-30) scale(1.3)"/>
      <use href="#frond" transform="translate(210,240) rotate(120) scale(1.4)"/>
    </svg>

    <div class="brand-top">
      <div class="brand-mark"><img src="/assets/logo.jpeg" alt="PalmaData"></div>
      <div class="brand-name">Palma<span>Data</span></div>
    </div>

    <div class="brand-hero">
      <span class="eyebrow">Grupo Palmero · Santander</span>
      <h1>Datos que hacen crecer la palma</h1>
      <p>Gestión y análisis para el cultivo de palma de aceite. Un solo lugar para las decisiones agronómicas de la plantación.</p>
    </div>

    <div class="brand-foot">© 2026 Grupo Palmero</div>
  </section>

  <!-- Formulario -->
  <section class="form-panel">
    <div class="card">
      <h2>Ingresar</h2>
      <p class="sub">Escribe tu usuario y contraseña para continuar.</p>

      <div class="error" id="error"></div>

      <form id="loginForm">
        <div class="field">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" name="clave" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="btn">Entrar</button>
      </form>
    </div>
  </section>

</div>

<script>
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('error');
const btn = document.getElementById('btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Verificando…';

  const data = new FormData();
  data.append('usuario', document.getElementById('usuario').value);
  data.append('clave', document.getElementById('clave').value);

  try {
    const res = await fetch('/api/auth/login', { method:'POST', body:data });
    const json = await res.json();
    if (json.ok) {
      window.location.href = '/';
    } else {
      errorBox.textContent = json.mensaje || 'No se pudo ingresar.';
      errorBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  } catch (err) {
    errorBox.textContent = 'Error de conexión con el servidor.';
    errorBox.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
